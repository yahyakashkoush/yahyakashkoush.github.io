# Deploy the repository root as a Blueprint. Admin is part of this SPA.
# These are PUBLIC browser credentials, not service-role/management secrets.
services:
  - type: web
    name: yahya-portfolio
    runtime: static
    buildCommand: bash scripts/render-build.sh
    staticPublishPath: artifacts/portfolio/dist/public
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_SUPABASE_URL
        value: https://ifljomfujnlamnduldaz.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_DQoOhAyUozkzdrd-at_O8g_1PvSSfpx
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
